name: Kik
description: 'Kik is a freeware instant-messaging mobile app for iOS and Android, known for letting
  users register with only a username rather than a phone number. Founded in 2009 by University of
  Waterloo students and released in 2010, Kik grew to hundreds of millions of registered users and was
  especially popular with teens. It has been owned by MediaLab AI since 2019. Kik formerly operated a
  developer surface — the Kik Bot Platform at dev.kik.com — and the Kin cryptocurrency, but that
  developer/bot API platform is no longer online and Kik currently publishes no public API.'
